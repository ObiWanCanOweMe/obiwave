name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: controller
            command: npm run lint && npm test
          - package: web
            command: npm run lint && npm run test:audio-format && npm run test:llm-provider && npm run test:onboarding-provider-state && npm run test:async-generation && npm run build
          - package: mcp-subwave
            command: npm run lint
          - package: cli
            command: npm run typecheck
          - package: app
            command: npm run lint && npm run typecheck
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - run: npm ci --no-audit --no-fund

      # mcp-subwave imports shared MCP sources from controller/src/mcp/**.
      # Install their dependencies so TypeScript can resolve those imports.
      - name: Install controller deps (mcp-subwave cross-package import)
        if: matrix.package == 'mcp-subwave'
        working-directory: controller
        run: npm ci --no-audit --no-fund

      - run: ${{ matrix.command }}

  deployment-contract:
    name: deployment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run deployment contract tests
        run: node --test scripts/release/fork-tag.test.mjs scripts/ci/validate-portainer-compose.test.mjs scripts/deploy/portainer-client.test.mjs

      - name: Validate Portainer manifest policy
        run: node scripts/ci/validate-portainer-compose.mjs deploy/portainer/docker-compose.yml

      - name: Render Portainer Compose configuration
        run: |
          trap 'rm -f deploy/portainer/stack.env' EXIT
          : > deploy/portainer/stack.env
          SUBWAVE_VERSION=v0.42.0-obiwave.1 ADMIN_USER=ci ADMIN_PASS=ci SITE_URL=https://radio.kener.org docker compose -f deploy/portainer/docker-compose.yml config --quiet

  image-smoke:
    name: image smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: broadcast
            dockerfile: docker/Dockerfile.broadcast
            build_args: ''
          - image: controller
            dockerfile: docker/Dockerfile.controller
            build_args: ''
          - image: web
            dockerfile: web/Dockerfile
            build_args: ''
          - image: analyzer
            dockerfile: docker/Dockerfile.analyzer
            build_args: |
              WITH_CLAP=0
              WITH_DEMUCS=0
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          push: false
          cache-from: type=gha,scope=smoke-${{ matrix.image }}
          cache-to: type=gha,scope=smoke-${{ matrix.image }},mode=max
