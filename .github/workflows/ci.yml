name: CI

on:
  pull_request:
  push:
  workflow_call:
    inputs:
      checkout_ref:
        description: Optional source commit or ref to test
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  quality:
    name: quality (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: controller
            command: npm run lint && npm test
          - package: web
            command: npm run lint && npm run test:audio-format && npm run test:stream-auth-format && npm run test:llm-provider && npm run test:mounted-state && npm run test:async-generation && npm run test:model-discovery-request && npm run test:llm-section-provider-url-contract && npm run build
          - package: mcp-subwave
            command: npm run lint
          - package: cli
            command: npm run typecheck
          - package: app
            command: npm run lint && npm run typecheck && npm run test:stream-buffer-format && npm run test:station-credentials
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Verify theme-token mirror is up to date
        if: matrix.package == 'controller'
        run: |
          npm run gen:themes
          git diff --exit-code ../web/lib/theme-tokens.generated.ts

      - name: Verify schema mirror is up to date
        if: matrix.package == 'controller'
        run: |
          npm run gen:schemas
          git diff --exit-code ../web/lib/schemas.generated.ts

      - name: Verify controller and web declare the same zod version
        if: matrix.package == 'controller'
        run: |
          node -e '
            const c = require("./package.json").dependencies.zod;
            const w = require("../web/package.json").dependencies.zod;
            for (const [pkg, range] of [["controller", c], ["web", w]]) {
              if (!range) process.exit(1);
            }
            if (c !== w) process.exit(1);
            console.log(`zod ${c} on both sides`);
          '

      - name: Install analyzer Python test dependencies
        if: matrix.package == 'controller'
        run: |
          python3 -m venv .venv-analyzer-tests
          .venv-analyzer-tests/bin/python -m pip install --disable-pip-version-check --no-cache-dir numpy==2.2.6
          echo "$PWD/.venv-analyzer-tests/bin" >> "$GITHUB_PATH"

      # mcp-subwave imports shared MCP sources from controller/src/mcp/**.
      # Install their dependencies so TypeScript can resolve those imports.
      - name: Install controller deps (mcp-subwave cross-package import)
        if: matrix.package == 'mcp-subwave'
        working-directory: controller
        run: npm ci --no-audit --no-fund

      - run: ${{ matrix.command }}

  deployment-contract:
    name: deployment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run deployment contract tests
        run: node --test scripts/release/fork-tag.test.mjs scripts/release/mirror-cuda-analyzer.test.mjs scripts/ci/validate-portainer-compose.test.mjs scripts/ci/assert-image-tag-absent.test.mjs scripts/ci/pinned-download.test.mjs scripts/ci/workflow-contract.test.mjs scripts/deploy/portainer-client.test.mjs scripts/security/trivy-policy.test.mjs

      - name: Validate Portainer manifest policy
        run: |
          trap 'rm -f deploy/portainer/stack.env' EXIT
          : > deploy/portainer/stack.env
          SUBWAVE_VERSION=v0.42.0-obiwave.1 ADMIN_USER=ci ADMIN_PASS=ci SITE_URL=https://radio.kener.org node scripts/ci/validate-portainer-compose.mjs deploy/portainer/docker-compose.yml

      - name: Render Portainer Compose configuration
        run: |
          trap 'rm -f deploy/portainer/stack.env' EXIT
          : > deploy/portainer/stack.env
          SUBWAVE_VERSION=v0.42.0-obiwave.1 ADMIN_USER=ci ADMIN_PASS=ci SITE_URL=https://radio.kener.org docker compose -f deploy/portainer/docker-compose.yml config --quiet

  image-smoke:
    name: image smoke (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: broadcast
            dockerfile: docker/Dockerfile.broadcast
            build_args: ''
          - image: controller
            dockerfile: docker/Dockerfile.controller
            build_args: ''
          - image: web
            dockerfile: web/Dockerfile
            build_args: ''
          - image: analyzer
            dockerfile: docker/Dockerfile.analyzer
            build_args: |
              WITH_CLAP=0
              WITH_DEMUCS=0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: ${{ matrix.build_args }}
          push: false
          load: true
          tags: subwave-ci-${{ matrix.image }}:test
          cache-from: type=gha,scope=smoke-${{ matrix.image }}
          cache-to: type=gha,scope=smoke-${{ matrix.image }},mode=max

      - name: Run controller production child command
        if: matrix.image == 'controller'
        run: |
          docker run --rm --entrypoint /bin/sh subwave-ci-controller:test -ceu '
            test ! -e /usr/local/bin/npm
            test ! -e /usr/local/bin/npx
            exec /app/node_modules/.bin/tsx scripts/production-command.test.ts
          '
