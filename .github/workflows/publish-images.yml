name: Publish images

# Builds and pushes the first-party SUB/WAVE images to GHCR.
#
# Triggered only by fork-qualified release tags. The validate job is the
# authoritative boundary; the tag glob is intentionally only a coarse filter.
#
# Images:
#   ghcr.io/<owner>/subwave-caddy       (bakes docker/Caddyfile)
#   ghcr.io/<owner>/subwave-broadcast   (icecast2 + liquidsoap + radio.liq + sounds/)
#   ghcr.io/<owner>/subwave-controller
#   ghcr.io/<owner>/subwave-web
#   ghcr.io/<owner>/subwave-aio         (whole stack in one container — the Unraid
#                                        Community Applications one-click image)
#   ghcr.io/<owner>/subwave-tts-heavy   (optional Chatterbox + PocketTTS sidecar, ~3-4GB)
#   ghcr.io/<owner>/subwave-tts-heavy-cuda (optional CUDA Chatterbox + PocketTTS sidecar)
#   ghcr.io/<owner>/subwave-analyzer-cuda (mirrored exact upstream CUDA analyzer)
#
# Platforms: the core four images (caddy, broadcast, controller, web) are
# multi-arch (linux/amd64 + linux/arm64) so Apple Silicon and ARM servers run
# natively instead of under emulation. Dockerfile.controller selects the
# matching Piper build via $TARGETARCH; Kokoro/onnx have arm64 wheels. The
# optional tts-heavy sidecar stays amd64-only — its heavy PyTorch stack makes
# an arm64 cross-build slow/large, and it's opt-in (runs fine under emulation).

on:
  push:
    tags:
      - 'v*-obiwave.*'

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate immutable fork release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "import('./scripts/release/fork-tag.mjs').then(({ parseForkTag }) => parseForkTag(process.env.RELEASE_TAG))"

  release-gate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  tag-preflight:
    needs: validate
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - subwave-caddy
          - subwave-broadcast
          - subwave-controller
          - subwave-web
          - subwave-aio
          - subwave-aio-heavy
          - subwave-tts-heavy
          - subwave-tts-heavy-cuda
          - subwave-analyzer
          - subwave-analyzer-heavy
          - subwave-analyzer-cuda
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prove the exact release tag is absent
        env:
          IMAGE_REF: ghcr.io/obiwancanoweme/${{ matrix.image }}:${{ github.ref_name }}
        run: node scripts/ci/assert-image-tag-absent.mjs "$IMAGE_REF"

  mirror-cuda-analyzer:
    needs: [validate, release-gate, tag-preflight]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror exact upstream CUDA analyzer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/mirror-cuda-analyzer.mjs

  build:
    needs: [validate, release-gate, tag-preflight]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Stagger the pushes. Ten images are source-built and push their immutable
      # release tag; the eleventh is the exact upstream CUDA analyzer mirror.
      # When several builds finish their layer uploads in the same window, GHCR
      # answers the manifest PUT with a 403 "secondary rate limit" (hit on the v1.7.0 run —
      # subwave-analyzer-heavy failed at `exporting to image` after the layers
      # were already up, and a re-run of that job alone passed unchanged). The
      # builds have very different durations, so capping concurrency spreads the
      # completions out. Costs wall-clock on a release run; tag pushes are rare.
      max-parallel: 4
      matrix:
        include:
          - image: subwave-caddy
            dockerfile: docker/Dockerfile.caddy
            platforms: linux/amd64,linux/arm64
          - image: subwave-broadcast
            dockerfile: docker/Dockerfile.broadcast
            platforms: linux/amd64,linux/arm64
          - image: subwave-controller
            dockerfile: docker/Dockerfile.controller
            platforms: linux/amd64,linux/arm64
          - image: subwave-web
            dockerfile: web/Dockerfile
            platforms: linux/amd64,linux/arm64
          # The Unraid one-click image: the whole stack (icecast2 + liquidsoap,
          # controller, web, Caddy) in one container, supervised by
          # docker/aio/supervisor.sh. amd64-only (x86-64 — every Unraid box, the
          # target for this image). arm64 is deliberately NOT built here: the
          # bundled Next.js webbuild fails its arm64 cross-build under QEMU
          # because lightningcss (Tailwind) can't load its native
          # `lightningcss.linux-arm64-gnu.node` binary in the emulated stage.
          # Native-arm64 users can still run the split-stack images, which stay
          # multi-arch. Revisit if the lightningcss/QEMU issue is resolved.
          - image: subwave-aio
            dockerfile: docker/Dockerfile.aio
            platforms: linux/amd64
            # Lean by default: the bundled analyzer is librosa-only
            # (bpm/key/intro/loudness), no torch. The subwave-aio-heavy entry
            # below bakes CLAP + Demucs for operators who want "sounds-like".
            build_args: |
              WITH_CLAP=0
              WITH_DEMUCS=0
          # Heavy AIO — same one-click container with the CLAP "sounds-like" +
          # Demucs vocal stack baked in (~1.5GB torch each). Unraid one-click
          # users who want those dimensions repoint their container at the
          # `-heavy` tag; everyone else uses the lean subwave-aio above.
          - image: subwave-aio-heavy
            dockerfile: docker/Dockerfile.aio
            platforms: linux/amd64
            build_args: |
              WITH_CLAP=1
              WITH_DEMUCS=1
          - image: subwave-tts-heavy
            dockerfile: docker/Dockerfile.tts-heavy
            platforms: linux/amd64
          - image: subwave-tts-heavy-cuda
            dockerfile: docker/Dockerfile.tts-heavy
            platforms: linux/amd64
            build_args: |
              CHATTERBOX_TORCH_INDEX_URL=https://download.pytorch.org/whl/cu124
            # TTS-only (Chatterbox + PocketTTS). Acoustic analysis (librosa +
            # CLAP + Demucs) was moved out into the standalone subwave-analyzer
            # image, so no analyzer build args here anymore.
          # The default-on acoustic-analysis sidecar. LEAN + MULTI-ARCH: librosa
          # only (bpm/key/intro/loudness), no torch — small enough to ship on by
          # default and run natively on arm64 (NAS/Pi/Apple-Silicon). CLAP
          # "sounds-like" + Demucs vocals are the heavy opt-in below.
          - image: subwave-analyzer
            dockerfile: docker/Dockerfile.analyzer
            platforms: linux/amd64,linux/arm64
            build_args: |
              WITH_CLAP=0
              WITH_DEMUCS=0
          # Heavy analyzer — same image with the CLAP + Demucs CPU-torch stack
          # baked in (~1.9GB). amd64-only (matching tts-heavy — the heavy PyTorch
          # stack). Operators opt in with ANALYZER_HEAVY=1 in .env, which points
          # the compose `analyzer` service at this `-heavy` image. Lazy-loaded
          # weights at runtime, disk cost only.
          - image: subwave-analyzer-heavy
            dockerfile: docker/Dockerfile.analyzer
            platforms: linux/amd64
            build_args: |
              WITH_CLAP=1
              WITH_DEMUCS=1
    steps:
      - uses: actions/checkout@v5

      # QEMU provides the cross-arch emulation buildx needs to build the
      # linux/arm64 variant on the amd64 GitHub runner.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: |
            ${{ matrix.build_args }}
            SUBWAVE_BUILD_VERSION=${{ github.ref_name }}
          push: true
          tags: ghcr.io/obiwancanoweme/${{ matrix.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Record immutable image digest
        run: |
          echo '### Published image' >> "$GITHUB_STEP_SUMMARY"
          echo '- Image: `${{ matrix.image }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Tag: `${{ github.ref_name }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Digest: `${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"

      - name: Record exact CUDA TTS build digest
        if: matrix.image == 'subwave-tts-heavy-cuda'
        env:
          IMAGE: subwave-tts-heavy-cuda
          TAG_REF: ghcr.io/obiwancanoweme/subwave-tts-heavy-cuda:${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/cuda-tts-build-digest
        run: |
          node scripts/release/image-digest-record.mjs create \
            --image "$IMAGE" \
            --tag-ref "$TAG_REF" \
            --digest "$DIGEST" \
            --directory "$OUTPUT_DIRECTORY"

      - name: Upload exact CUDA TTS build digest
        if: matrix.image == 'subwave-tts-heavy-cuda'
        # Workflow artifacts are run-scoped, including jobs inside the called
        # scanner workflow. Scan and deploy therefore consume this same record.
        uses: actions/upload-artifact@v4
        with:
          name: cuda-tts-build-digest
          path: ${{ runner.temp }}/cuda-tts-build-digest/subwave-tts-heavy-cuda.json
          if-no-files-found: error

  vulnerability-policy:
    needs: [validate, release-gate, tag-preflight, build, mirror-cuda-analyzer]
    uses: ./.github/workflows/scan-images.yml
    with:
      release_tag: ${{ github.ref_name }}
      cuda_tts_digest_artifact: cuda-tts-build-digest
    permissions:
      contents: read
      packages: read
      security-events: write

  deploy-production:
    needs: [validate, release-gate, tag-preflight, build, mirror-cuda-analyzer, vulnerability-policy]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: subwave-production
      cancel-in-progress: false
    # Worst case: 2 x 5-minute stack updates, a 20-minute first-boot CUDA TTS
    # model-load budget, rollback probes, grace, and snapshot overhead.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Download exact CUDA TTS build digest
        uses: actions/download-artifact@v4
        with:
          name: cuda-tts-build-digest
          path: ${{ runner.temp }}/cuda-tts-build-digest
      - name: Deploy immutable release through Portainer
        run: node scripts/deploy/portainer-release.mjs
        env:
          PORTAINER_URL: ${{ vars.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
          SUBWAVE_RELEASE_TAG: ${{ github.ref_name }}
          SUBWAVE_HEALTH_URL: ${{ vars.SUBWAVE_HEALTH_URL }}
          SUBWAVE_STREAM_URL: ${{ vars.SUBWAVE_STREAM_URL }}
          SUBWAVE_STREAM_PASSWORD: ${{ secrets.SUBWAVE_STREAM_PASSWORD }}
          SUBWAVE_TTS_DIGEST_DIRECTORY: ${{ runner.temp }}/cuda-tts-build-digest
