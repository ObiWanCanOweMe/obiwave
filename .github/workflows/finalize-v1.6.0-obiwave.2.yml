name: Finalize v1.6.0-obiwave.2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recover-v1.6.0-obiwave.2
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify immutable recovery artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/recovery-manifest.mjs verify-all
          --manifest security/releases/v1.6.0-obiwave.2.json
          --scanner security/trivy-scanner.json
          --repository ObiWanCanOweMe/obiwave

  deploy-production:
    needs: [validate]
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: subwave-production
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reverify immutable recovery artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/recovery-manifest.mjs verify-all
          --manifest security/releases/v1.6.0-obiwave.2.json
          --scanner security/trivy-scanner.json
          --repository ObiWanCanOweMe/obiwave
      - name: Deploy immutable release through Portainer
        env:
          PORTAINER_URL: ${{ vars.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          PORTAINER_STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
          PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
          SUBWAVE_RELEASE_TAG: v1.6.0-obiwave.2
          SUBWAVE_HEALTH_URL: ${{ vars.SUBWAVE_HEALTH_URL }}
          SUBWAVE_STREAM_URL: ${{ vars.SUBWAVE_STREAM_URL }}
          SUBWAVE_STREAM_PASSWORD: ${{ secrets.SUBWAVE_STREAM_PASSWORD }}
        run: node scripts/deploy/portainer-release.mjs
