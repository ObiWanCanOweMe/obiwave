name: Scan images

# Scan every published release image. SARIF remains an observability channel;
# the independent JSON artifacts feed the fail-closed aggregate policy gate.

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact fork-qualified release tag to scan
        required: true
        type: string
      recovery_manifest:
        description: Optional repository-relative immutable recovery manifest
        required: false
        default: ''
        type: string
      partial_recovery_manifest:
        description: Approved repository-relative partial recovery manifest
        required: false
        default: ''
        type: string
      sealed_recovery_manifest_b64:
        description: Base64 sealed recovery manifest from an upstream job
        required: false
        default: ''
        type: string
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact fork-qualified release tag to scan
        required: true
        type: string
      recovery_manifest:
        description: Optional repository-relative immutable recovery manifest
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      scanner_image: ${{ steps.resolve.outputs.scanner_image }}
      scanner_version: ${{ steps.resolve.outputs.scanner_version }}
      recovery_mode: ${{ steps.resolve.outputs.recovery_mode }}
      recovery_manifest: ${{ steps.resolve.outputs.recovery_manifest }}
      partial_recovery_manifest: ${{ steps.resolve.outputs.partial_recovery_manifest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Resolve and validate release tag
        id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          RECOVERY_MANIFEST: ${{ inputs.recovery_manifest }}
          PARTIAL_RECOVERY_MANIFEST: ${{ inputs.partial_recovery_manifest }}
          SEALED_RECOVERY_MANIFEST_B64: ${{ inputs.sealed_recovery_manifest_b64 }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            RELEASE_TAG="$(git tag --list 'v*-obiwave.*' --sort=-version:refname | head -1)"
          else
            RELEASE_TAG="$REQUESTED_TAG"
          fi
          RELEASE_TAG="$RELEASE_TAG" node -e "import('./scripts/release/fork-tag.mjs').then(({ parseForkTag }) => parseForkTag(process.env.RELEASE_TAG))"

          if [[ -n "$RECOVERY_MANIFEST" && ( -n "$PARTIAL_RECOVERY_MANIFEST" || -n "$SEALED_RECOVERY_MANIFEST_B64" ) ]]; then
            echo 'recovery_manifest is mutually exclusive with sealed recovery inputs' >&2
            exit 1
          fi
          if [[ -n "$PARTIAL_RECOVERY_MANIFEST" && -z "$SEALED_RECOVERY_MANIFEST_B64" ]] \
            || [[ -z "$PARTIAL_RECOVERY_MANIFEST" && -n "$SEALED_RECOVERY_MANIFEST_B64" ]]; then
            echo 'partial_recovery_manifest and sealed_recovery_manifest_b64 must be supplied together' >&2
            exit 1
          fi

          RECOVERY_MODE=none
          RESOLVED_RECOVERY_MANIFEST=''
          RESOLVED_PARTIAL_RECOVERY_MANIFEST=''
          if [[ -n "$RECOVERY_MANIFEST" ]]; then
            [[ "$RECOVERY_MANIFEST" =~ ^security/releases/[A-Za-z0-9._-]+\.json$ ]] || {
              echo 'recovery_manifest must be repository-relative below security/releases/' >&2
              exit 1
            }
            node scripts/release/recovery-manifest.mjs validate \
              --manifest "$RECOVERY_MANIFEST" \
              --scanner security/trivy-scanner.json
            MANIFEST_PATH="$RECOVERY_MANIFEST" EXPECTED_RELEASE_TAG="$RELEASE_TAG" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile(process.env.MANIFEST_PATH, 'utf8'));
          if (manifest.releaseTag !== process.env.EXPECTED_RELEASE_TAG) {
            throw new Error('recovery manifest release tag does not match the requested tag');
          }
          NODE
            RECOVERY_MODE=static
            RESOLVED_RECOVERY_MANIFEST="$RECOVERY_MANIFEST"
          elif [[ -n "$PARTIAL_RECOVERY_MANIFEST" ]]; then
            [[ "$PARTIAL_RECOVERY_MANIFEST" =~ ^security/releases/[A-Za-z0-9._-]+\.json$ ]] || {
              echo 'partial_recovery_manifest must be repository-relative below security/releases/' >&2
              exit 1
            }
            RESOLVED_RECOVERY_MANIFEST="security/releases/runtime-$RELEASE_TAG.json"
            node scripts/release/recovery-manifest.mjs materialize-sealed \
              --manifest "$PARTIAL_RECOVERY_MANIFEST" \
              --scanner security/trivy-scanner.json \
              --output "$RESOLVED_RECOVERY_MANIFEST"
            MANIFEST_PATH="$RESOLVED_RECOVERY_MANIFEST" EXPECTED_RELEASE_TAG="$RELEASE_TAG" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile(process.env.MANIFEST_PATH, 'utf8'));
          if (manifest.releaseTag !== process.env.EXPECTED_RELEASE_TAG) {
            throw new Error('sealed recovery manifest release tag does not match the requested tag');
          }
          NODE
            RECOVERY_MODE=sealed
            RESOLVED_PARTIAL_RECOVERY_MANIFEST="$PARTIAL_RECOVERY_MANIFEST"
          fi
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';
          const scanner = JSON.parse(await readFile('security/trivy-scanner.json', 'utf8'));
          const keys = ['schemaVersion', 'version', 'imageRef'];
          if (scanner === null || typeof scanner !== 'object' || Array.isArray(scanner)
            || Object.keys(scanner).length !== keys.length || !keys.every((key) => Object.hasOwn(scanner, key))
            || scanner.schemaVersion !== 1 || !/^\d+\.\d+\.\d+$/.test(scanner.version)
            || !/^[a-z0-9][a-z0-9./_-]*@sha256:[a-f0-9]{64}$/.test(scanner.imageRef)) {
            throw new Error('security/trivy-scanner.json is invalid');
          }
          console.log(`scanner_image=${scanner.imageRef}`);
          console.log(`scanner_version=${scanner.version}`);
          NODE
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "recovery_mode=$RECOVERY_MODE" >> "$GITHUB_OUTPUT"
          echo "recovery_manifest=$RESOLVED_RECOVERY_MANIFEST" >> "$GITHUB_OUTPUT"
          echo "partial_recovery_manifest=$RESOLVED_PARTIAL_RECOVERY_MANIFEST" >> "$GITHUB_OUTPUT"

  scan:
    needs: resolve-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - subwave-caddy
          - subwave-broadcast
          - subwave-controller
          - subwave-web
          - subwave-aio
          - subwave-aio-heavy
          - subwave-tts-heavy
          - subwave-analyzer
          - subwave-analyzer-heavy
          - subwave-analyzer-cuda
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize sealed recovery manifest
        if: needs.resolve-tag.outputs.recovery_mode == 'sealed'
        env:
          PARTIAL_RECOVERY_MANIFEST: ${{ needs.resolve-tag.outputs.partial_recovery_manifest }}
          RECOVERY_MANIFEST: ${{ needs.resolve-tag.outputs.recovery_manifest }}
          RECOVERY_MODE: ${{ needs.resolve-tag.outputs.recovery_mode }}
          SEALED_RECOVERY_MANIFEST_B64: ${{ inputs.sealed_recovery_manifest_b64 }}
        run: |
          [[ "$RECOVERY_MODE" == 'sealed' ]]
          node scripts/release/recovery-manifest.mjs materialize-sealed \
            --manifest "$PARTIAL_RECOVERY_MANIFEST" \
            --scanner security/trivy-scanner.json \
            --output "$RECOVERY_MANIFEST"

      - name: Resolve immutable image references
        id: refs
        env:
          IMAGE: ${{ matrix.image }}
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
          RECOVERY_MANIFEST: ${{ needs.resolve-tag.outputs.recovery_manifest }}
          PARTIAL_RECOVERY_MANIFEST: ${{ needs.resolve-tag.outputs.partial_recovery_manifest }}
          RECOVERY_MODE: ${{ needs.resolve-tag.outputs.recovery_mode }}
        run: |
          if [[ "$RECOVERY_MODE" == 'static' ]]; then
            node scripts/release/recovery-manifest.mjs image \
              --manifest "$RECOVERY_MANIFEST" \
              --scanner security/trivy-scanner.json \
              --image "$IMAGE"
          elif [[ "$RECOVERY_MODE" == 'sealed' ]]; then
            node scripts/release/recovery-manifest.mjs sealed-image \
              --manifest "$RECOVERY_MANIFEST" \
              --partial-manifest "$PARTIAL_RECOVERY_MANIFEST" \
              --scanner security/trivy-scanner.json \
              --image "$IMAGE"
          elif [[ "$RECOVERY_MODE" == 'none' ]]; then
            echo "tag_ref=ghcr.io/obiwancanoweme/$IMAGE:$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo 'unrecognized recovery mode' >&2
            exit 1
          fi

      - name: Scan ${{ matrix.image }} for policy JSON
        id: json-scan
        continue-on-error: true
        env:
          IMAGE: ${{ matrix.image }}
          TAG_REF: ${{ steps.refs.outputs.tag_ref }}
          PULL_REF: ${{ steps.refs.outputs.pull_ref }}
          RECOVERY_MANIFEST: ${{ needs.resolve-tag.outputs.recovery_manifest }}
          PARTIAL_RECOVERY_MANIFEST: ${{ needs.resolve-tag.outputs.partial_recovery_manifest }}
          RECOVERY_MODE: ${{ needs.resolve-tag.outputs.recovery_mode }}
        run: |
          recovery_args=()
          if [[ "$RECOVERY_MODE" == 'static' || "$RECOVERY_MODE" == 'sealed' ]]; then
            recovery_args=(--recovery-manifest "$RECOVERY_MANIFEST")
          fi
          if [[ "$RECOVERY_MODE" == 'sealed' ]]; then
            recovery_args+=(--partial-recovery-manifest "$PARTIAL_RECOVERY_MANIFEST")
          elif [[ "$RECOVERY_MODE" != 'none' && "$RECOVERY_MODE" != 'static' ]]; then
            echo 'unrecognized recovery mode' >&2
            exit 1
          fi
          if [[ "$RECOVERY_MODE" == 'static' || "$RECOVERY_MODE" == 'sealed' ]]; then
            recovery_args+=(--pull-ref "$PULL_REF")
          fi
          node scripts/security/trivy-runner.mjs \
            --scanner security/trivy-scanner.json \
            --image-name "$IMAGE" \
            --tag-ref "$TAG_REF" \
            --format json \
            --output "$IMAGE.json" \
            --cache-directory .tmp/trivy-cache \
            "${recovery_args[@]}"

      - name: Exercise production child command in ${{ matrix.image }}
        if: always() && contains(fromJSON('["subwave-controller","subwave-aio","subwave-aio-heavy"]'), matrix.image) && steps.json-scan.outcome == 'success'
        run: |
          docker run --rm --entrypoint /bin/sh ${{ steps.refs.outputs.tag_ref }} -ceu '
            test ! -e /usr/local/bin/npm
            test ! -e /usr/local/bin/npx
            exec /app/node_modules/.bin/tsx scripts/production-command.test.ts
          '

      - name: Record JSON scanner status
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
          IMAGE_REF: ${{ steps.refs.outputs.tag_ref }}
          SCAN_OUTCOME: ${{ steps.json-scan.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const succeeded = process.env.SCAN_OUTCOME === 'success';
          const status = {
            schemaVersion: 1,
            image: process.env.IMAGE,
            imageRef: process.env.IMAGE_REF,
            scanner: 'trivy',
            scannerVersion: '0.67.2',
            scanners: ['vuln'],
            severities: ['CRITICAL', 'HIGH'],
            outcome: succeeded ? 'success' : 'failure',
            ...(succeeded ? {} : { error: `Trivy action outcome: ${process.env.SCAN_OUTCOME}` }),
          };
          writeFileSync(`${process.env.IMAGE}.status.json`, `${JSON.stringify(status, null, 2)}\n`);
          NODE

      - name: Upload policy JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-json-${{ matrix.image }}
          path: |
            ${{ matrix.image }}.json
            ${{ matrix.image }}.status.json
          if-no-files-found: warn

      - name: Scan ${{ matrix.image }} for SARIF
        continue-on-error: true
        env:
          IMAGE: ${{ matrix.image }}
          TAG_REF: ${{ steps.refs.outputs.tag_ref }}
          PULL_REF: ${{ steps.refs.outputs.pull_ref }}
          RECOVERY_MANIFEST: ${{ needs.resolve-tag.outputs.recovery_manifest }}
          PARTIAL_RECOVERY_MANIFEST: ${{ needs.resolve-tag.outputs.partial_recovery_manifest }}
          RECOVERY_MODE: ${{ needs.resolve-tag.outputs.recovery_mode }}
        run: |
          recovery_args=()
          if [[ "$RECOVERY_MODE" == 'static' || "$RECOVERY_MODE" == 'sealed' ]]; then
            recovery_args=(--recovery-manifest "$RECOVERY_MANIFEST")
          fi
          if [[ "$RECOVERY_MODE" == 'sealed' ]]; then
            recovery_args+=(--partial-recovery-manifest "$PARTIAL_RECOVERY_MANIFEST")
          elif [[ "$RECOVERY_MODE" != 'none' && "$RECOVERY_MODE" != 'static' ]]; then
            echo 'unrecognized recovery mode' >&2
            exit 1
          fi
          if [[ "$RECOVERY_MODE" == 'static' || "$RECOVERY_MODE" == 'sealed' ]]; then
            recovery_args+=(--pull-ref "$PULL_REF")
          fi
          node scripts/security/trivy-runner.mjs \
            --scanner security/trivy-scanner.json \
            --image-name "$IMAGE" \
            --tag-ref "$TAG_REF" \
            --format sarif \
            --output "trivy-$IMAGE.sarif" \
            --cache-directory .tmp/trivy-cache \
            "${recovery_args[@]}"

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  vulnerability-policy:
    needs: [resolve-tag, scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Download all policy reports
        uses: actions/download-artifact@v4
        with:
          pattern: trivy-json-*
          path: .tmp/trivy-policy
          merge-multiple: true
      - name: Enforce Critical/High vulnerability policy
        run: >-
          node scripts/security/trivy-policy.mjs
          --reports .tmp/trivy-policy
          --acceptance security/trivy-acceptance.json
          --tag "${{ needs.resolve-tag.outputs.tag }}"
