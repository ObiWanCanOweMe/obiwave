name: Scan images

# Weekly Trivy vulnerability scan of the published GHCR images, with results
# uploaded to GitHub code scanning (repo Security tab).
#
# Non-blocking by design: this is the first scan being introduced, so it
# REPORTS findings rather than failing the job on them (exit-code 0). Once a
# clean baseline exists, flip exit-code to fail on CRITICAL/HIGH.
#
# Scans only the lean, multi-arch images that the default install pulls. The
# heavy amd64-only images (tts-heavy, aio, aio-heavy) are intentionally
# skipped to keep the matrix runtime sane — they are opt-in and share the same
# base layers as their lean counterparts.

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact fork-qualified release tag to scan
        required: true
        type: string
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact fork-qualified release tag to scan
        required: true
        type: string

permissions:
  contents: read
  packages: read
  security-events: write   # for github/codeql-action/upload-sarif

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Resolve and validate release tag
        id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            RELEASE_TAG="$(git tag --list 'v*-obiwave.*' --sort=-version:refname | head -1)"
          else
            RELEASE_TAG="$REQUESTED_TAG"
          fi
          RELEASE_TAG="$RELEASE_TAG" node -e "import('./scripts/release/fork-tag.mjs').then(({ parseForkTag }) => parseForkTag(process.env.RELEASE_TAG))"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  scan:
    needs: resolve-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [caddy, broadcast, controller, web, analyzer]
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/obiwancanoweme/subwave-${{ matrix.image }}:${{ needs.resolve-tag.outputs.tag }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"   # report only; never fail the job on vulnerabilities

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}   # keep matrix results distinct
