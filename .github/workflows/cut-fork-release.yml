name: Cut fork release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream semantic version without the v prefix
        required: true
        type: string
      revision:
        description: Positive fork release revision
        required: true
        type: string
      target:
        description: Branch, tag, or commit to release
        required: false
        default: develop
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate release ancestry and availability
        id: release
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
        run: |
          TAG="$(VERSION="$VERSION" REVISION="$REVISION" node -e "import('./scripts/release/fork-tag.mjs').then(({ makeForkTag }) => process.stdout.write(makeForkTag(process.env.VERSION, process.env.REVISION)))")"
          BASE_TAG="v${VERSION}"
          git fetch --no-tags https://github.com/perminder-klair/subwave.git "refs/tags/${BASE_TAG}:refs/tags/${BASE_TAG}"
          git rev-parse --verify "refs/tags/${BASE_TAG}^{commit}" >/dev/null
          git merge-base --is-ancestor "$BASE_TAG" HEAD
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null
          REMOTE_STATUS=$?
          set -e
          if [[ "$REMOTE_STATUS" -eq 0 ]]; then
            echo "Fork release tag already exists on origin: ${TAG}" >&2
            exit 1
          fi
          if [[ "$REMOTE_STATUS" -ne 2 ]]; then
            echo "Could not verify whether fork release tag exists: ${TAG}" >&2
            exit "$REMOTE_STATUS"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          GITHUB_SHA: ${{ steps.release.outputs.sha }}
        run: gh release create "${TAG}" --target "${GITHUB_SHA}" --generate-notes --title "SUB/WAVE ${TAG}"
